moddesc=Puts the SR-1 Normandy on the LE1 galaxy map, as in Mass Effect 2 and 3. At cluster and system level a lit ship takes the place of the orange cursor ring and turns toward where it flies, with the ME3 travel sound: a whoosh when it sets off and an engine loop while it moves. The mouse works as in ME2: an arrow pointer, hold the left button to fly toward it, click to select, and an Enter Orbit button appears when the ship is on a planet or system. The controller works as before. LE1's own 2D "you are here" marker is gone; the name labels stay. The galaxy level and the planet view are otherwise unchanged. In the Community Patch's Mod Settings Menu you can set the ship's speed, turn rate, response and size for every save. Requires the LE1 Community Patch 2.0 or later.
modver=0.23
modsite=https://github.com/Maxgoods62/galaxy-map-normandy
