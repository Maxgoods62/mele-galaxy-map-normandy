modname=Galaxy Map Normandy
moddev=Maxgoods
moddesc=Puts the SR-1 Normandy on the LE1 galaxy map, as in Mass Effect 2 and 3. At cluster and system level a lit ship takes the place of the orange cursor ring and turns toward where it flies. Its engines glow and trail blue light as in ME2, and its sound is made from the ME3 travel sound: a whoosh when it sets off, then an engine and a drive that rise with its speed. The mouse works as in ME2: an arrow pointer, hold the left button to fly toward it, click to select, and an Enter Orbit button appears when the ship is on a planet or system. The controller works as before. LE1's own 2D "you are here" marker is gone; the name labels stay. The galaxy level and the planet view are otherwise unchanged. In the Community Patch's Mod Settings Menu you can set the ship's speed, turn rate, response and size for every save. Requires the LE1 Community Patch 2.0 or later.
modver=1.0
modsite=https://www.nexusmods.com/masseffectlegendaryedition/mods/3538
