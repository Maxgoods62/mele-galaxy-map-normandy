moddesc=Dev mod for the ME2-style Normandy on the galaxy map (docs/09). An actor in GalaxyMapNormandy_NOR10 (loaded with the Normandy by the LE1CP Sideloader; class in Startup_MOD_GalaxyMapNormandy) moves a lit SR-1 with the map cursor at cluster and system level with the ME2/ME3 travel sound split as in ME3: a whoosh on start and an engine loop while it flies (GalaxyMapNormandy_SFX). The ship carries its own sky light. With the mouse it plays like ME2: an arrow pointer, hold the left button to fly the ship to it, click to select; the pad is untouched. Requires LE1CP.
